name: Native SG2002 RTSP (MMF)

on:
  push:
    paths:
      - "native-sdk/fix_mmf_rtsp.py"
      - "native-sdk/add_tcp_stream_mode.py"
      - "native-sdk/build-native-rtsp.sh"
      - ".github/workflows/native-rtsp.yml"
  workflow_dispatch:
    inputs:
      full_build:
        description: "Build complete SG2002 MMF SDK and upload patched RISC-V binary"
        type: boolean
        required: true
        default: true

jobs:
  verify-patch:
    name: Verify patch matches upstream SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned upstream source (lightweight check)
        run: |
          mkdir -p /tmp/lichee-sdk/middleware/v2/sample/test_mmf
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/sipeed/LicheeRV-Nano-Build/main/middleware/v2/sample/test_mmf/sample_vio.c' \
            -o /tmp/lichee-sdk/middleware/v2/sample/test_mmf/sample_vio.c
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/sipeed/LicheeRV-Nano-Build/main/middleware/v2/sample/test_mmf/sample_vio_main.c' \
            -o /tmp/lichee-sdk/middleware/v2/sample/test_mmf/sample_vio_main.c
          mkdir -p /tmp/lichee-sdk/middleware/v2/sample/test_mmf/media_server-1.0.1
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/sipeed/LicheeRV-Nano-Build/main/middleware/v2/sample/test_mmf/media_server-1.0.1/rtsp-server.cpp' \
            -o /tmp/lichee-sdk/middleware/v2/sample/test_mmf/media_server-1.0.1/rtsp-server.cpp
      - name: Validate and apply patch
        run: |
          python3 native-sdk/fix_mmf_rtsp.py /tmp/lichee-sdk --dry-run
          python3 native-sdk/fix_mmf_rtsp.py /tmp/lichee-sdk
          python3 native-sdk/fix_mmf_rtsp.py /tmp/lichee-sdk
          python3 native-sdk/add_tcp_stream_mode.py /tmp/lichee-sdk --dry-run
          python3 native-sdk/add_tcp_stream_mode.py /tmp/lichee-sdk
          python3 native-sdk/add_tcp_stream_mode.py /tmp/lichee-sdk
          python3 - <<'PY'
          from pathlib import Path
          p = Path("/tmp/lichee-sdk/middleware/v2/sample/test_mmf/sample_vio.c").read_text()
          s = p.split("static int _test_vi_venc_h265_rtsp(void)", 1)[1].split("static int _test_multiple_vi(void)", 1)[0]
          assert 'rtsp_server_init("0.0.0.0", 8554)' in s
          assert s.index("mmf_enc_h265_pop(ch, &stream)") < s.index("mmf_enc_h265_free(ch)")
          assert s.index("mmf_enc_h265_free(ch)") < s.index("mmf_vi_frame_free(vi_ch)")
          assert "[native-rtsp] frame=" in s
          rtsp = Path("/tmp/lichee-sdk/middleware/v2/sample/test_mmf/media_server-1.0.1/rtsp-server.cpp").read_text()
          assert rtsp.count('if (filename == "/live")') >= 2
          assert rtsp.count('filename.erase(0, 6);') >= 2
          assert 'if (!filename.empty() &&' in rtsp
          tcp = p.split("static int _test_vi_venc_h265_tcp(void)",1)[1].split("static int _test_rtsp_h264(void)",1)[0]
          assert 'tcp_h265_send_all(client_fd' in tcp
          assert 'listen_addr.sin_port = htons(8555);' in tcp
          assert 'if (send_failed) break;' in tcp
          entry = Path("/tmp/lichee-sdk/middleware/v2/sample/test_mmf/sample_vio_main.c").read_text()
          assert 'case 14:' in entry
          print("Patch OK: mode 10 RTSP fixes + mode 14 raw TCP fallback + idempotence")
          PY

  full-sdk-build:
    name: Build native RISC-V executable
    needs: verify-patch
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_build }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config git curl wget unzip file bc \
            flex bison python3 libssl-dev libncurses-dev rsync cpio
      - name: Restore cached SG2002 compiler archive
        id: tool-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/host-tools.tar.gz
          key: sg2002-host-tools-2026-v1
      - name: Download official SDK and host cross-toolchain
        run: |
          git clone --depth 1 https://github.com/sipeed/LicheeRV-Nano-Build.git "$RUNNER_TEMP/LicheeRV-Nano-Build"
          if [[ ! -s "$RUNNER_TEMP/host-tools.tar.gz" ]]; then
            curl -fL --retry 3 -o "$RUNNER_TEMP/host-tools.tar.gz" \
              "https://sophon-file.sophon.cn/sophon-prod-s3/drive/23/03/07/16/host-tools.tar.gz"
          fi
          mkdir -p "$RUNNER_TEMP/host-tools-extract"
          tar -xzf "$RUNNER_TEMP/host-tools.tar.gz" -C "$RUNNER_TEMP/host-tools-extract"
          CROSS_DIR="$(find "$RUNNER_TEMP/host-tools-extract" -type d -path '*/gcc/riscv64-linux-musl-x86_64' -print -quit)"
          test -n "$CROSS_DIR"
          HOST_ROOT="${CROSS_DIR%/gcc/riscv64-linux-musl-x86_64}"
          ln -s "$HOST_ROOT" "$RUNNER_TEMP/LicheeRV-Nano-Build/host-tools"
          ls "$RUNNER_TEMP/LicheeRV-Nano-Build/host-tools/gcc/riscv64-linux-musl-x86_64"
      - name: Cache toolchain before building (also on later build failures)
        if: steps.tool-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/host-tools.tar.gz
          key: sg2002-host-tools-2026-v1
      - name: Configure and build SG2002 middleware with patched native RTSP
        shell: bash
        run: |
          # The vendor build/cvisetup.sh intentionally reads unset variables.
          # Do not enable Bash nounset (-u) while using the Sipeed SDK.
          set -Eeo pipefail
          SDK="$RUNNER_TEMP/LicheeRV-Nano-Build"
          cd "$SDK"
          source build/cvisetup.sh
          defconfig sg2002_licheervnano_sd
          python3 "$GITHUB_WORKSPACE/native-sdk/fix_mmf_rtsp.py" "$SDK"
          python3 "$GITHUB_WORKSPACE/native-sdk/add_tcp_stream_mode.py" "$SDK"
          # In a fresh SDK checkout the kernel UAPI headers are not generated.
          # Middleware examples need linux/cvi_type.h and chip-specific cvi_defines.h.
          # Reuse the original SDK's user-space UAPI headers without building a kernel.
          UAPI="$SDK/linux_5.10/build/sg2002_licheervnano_sd/riscv/usr/include/linux"
          mkdir -p "$UAPI"
          for dir in \
            "$SDK/osdrv/interdrv/v2/include/common/uapi/linux" \
            "$SDK/osdrv/interdrv/v2/include/chip/mars/uapi/linux" \
            "$SDK/linux_5.10/drivers/staging/android/uapi"; do
            test -d "$dir"
            for header in "$dir"/*.h; do
              [[ -e "$UAPI/$(basename "$header")" ]] || ln -s "$header" "$UAPI/"
            done
          done
          test -f "$UAPI/cvi_type.h"
          test -f "$UAPI/cvi_defines.h"
          test -f "$UAPI/ion_cvitek.h"
          echo "Prepared SDK UAPI: $UAPI"
          # Prepacked libcvi_json-c/libcvi_miniz and related SDK prerequisites.
          build_3rd_party
          build_middleware
          test -s middleware/v2/sample/test_mmf/test_mmf
          mkdir -p "$GITHUB_WORKSPACE/native-sdk/out"
          cp middleware/v2/sample/test_mmf/test_mmf "$GITHUB_WORKSPACE/native-sdk/out/test_mmf_tcp"
          file "$GITHUB_WORKSPACE/native-sdk/out/test_mmf_tcp"
          file "$GITHUB_WORKSPACE/native-sdk/out/test_mmf_tcp" | grep -Eiq 'RISC-V|RISC.V'
      - uses: actions/upload-artifact@v4
        with:
          name: native-tcp-h265-sg2002-riscv64
          path: native-sdk/out/test_mmf_tcp
          if-no-files-found: error
